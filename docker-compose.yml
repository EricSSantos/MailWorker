services:
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ__USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ__PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq
    networks:
      - private_network
    restart: unless-stopped

  mail.worker:
    container_name: mailworker
    build:
      context: .
      dockerfile: Mail.Worker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      DOTNET_RUNNING_IN_CONTAINER: "true"

      # Application
      APPLICATION__NAME: ${APPLICATION__NAME}

      # SMTP
      SMTP__HOST: ${SMTP__HOST}
      SMTP__PORT: ${SMTP__PORT}
      SMTP__USER: ${SMTP__USER}
      SMTP__PASSWORD: ${SMTP__PASSWORD}
      SMTP__FROMEMAIL: ${SMTP__FROMEMAIL}
      SMTP__FROMNAME: ${SMTP__FROMNAME}
      SMTP__ENABLESSL: ${SMTP__ENABLESSL}

      # RabbitMQ
      RABBITMQ__HOST: rabbitmq
      RABBITMQ__PORT: 5672
      RABBITMQ__USER: ${RABBITMQ__USER}
      RABBITMQ__PASSWORD: ${RABBITMQ__PASSWORD}
      RABBITMQ__EMAILQUEUE: ${RABBITMQ__EMAILQUEUE}
      RABBITMQ__DEADLETTERQUEUE: ${RABBITMQ__DEADLETTERQUEUE}

    depends_on:
      - rabbitmq
    networks:
      - private_network
    restart: unless-stopped

volumes:
  rabbitmq_data:
  rabbitmq_logs:

networks:
  private_network:
    driver: bridge
