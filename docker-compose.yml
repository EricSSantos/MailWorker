services:
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ__USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ__PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json
    networks:
      - private_network
    restart: unless-stopped
    user: root

  mail.worker:
    container_name: mailworker
    build:
      context: .
      dockerfile: Mail.Worker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      DOTNET_RUNNING_IN_CONTAINER: "true"

      SMTP__HOST: ${SMTP__HOST}
      SMTP__PORT: ${SMTP__PORT}
      SMTP__USER: ${SMTP__USER}
      SMTP__PASSWORD: ${SMTP__PASSWORD}
      SMTP__FROMEMAIL: ${SMTP__FROMEMAIL}
      SMTP__FROMNAME: ${SMTP__FROMNAME}
      SMTP__ENABLESSL: ${SMTP__ENABLESSL}

      RABBITMQ__HOST: ${RABBITMQ__HOST}
      RABBITMQ__PORT: ${RABBITMQ__PORT}
      RABBITMQ__USER: ${RABBITMQ__USER}
      RABBITMQ__PASSWORD: ${RABBITMQ__PASSWORD}
      RABBITMQ__EMAILQUEUE: ${RABBITMQ__EMAILQUEUE}
      RABBITMQ__DEADLETTERQUEUE: ${RABBITMQ__DEADLETTERQUEUE}

    depends_on:
      - rabbitmq
    networks:
      - public_network
      - private_network
    restart: unless-stopped

volumes:
  rabbitmq_data:
  rabbitmq_logs:

networks:
  public_network:
    driver: bridge
  private_network:
    driver: bridge
